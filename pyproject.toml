[project]
name = "aipm-local-llm"
version = "0.1.0"
description = "Local LLM inference and evaluation for AI Product Managers"
readme = "README.md"
requires-python = ">=3.13.17,<3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "jsonschema>=4.26.0",
    "requests>=2.32.5",
]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
